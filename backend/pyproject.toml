[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for AI Supply Chain Digital Twin"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "redis>=5.0.3",
    "aio-pika>=9.4.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.1",
    "pgvector>=0.2.5",
    "alembic>=1.13.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "ruff>=0.3.3",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
